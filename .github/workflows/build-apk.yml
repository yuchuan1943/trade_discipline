# ============================================================
# 交易守则打卡 — 自动打包并发布 GitHub Release
# 触发方式：
#   1. 推送 tag（v*，如 v1.0.0）→ 构建 APK 并发布 Release
#   2. 在 GitHub 仓库 Actions 页手动触发（workflow_dispatch，仅打包）
# 产物：build/app/outputs/flutter-apk/ 下 universal + 分 ABI APK
# ============================================================
name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: 'stable'
          cache: true

      - name: Verify Flutter
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Build universal APK (release)
        run: flutter build apk --release

      - name: Build split APKs (release, per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: trade-discipline-universal
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload split APKs
        uses: actions/upload-artifact@v4
        with:
          name: trade-discipline-split-per-abi
          path: build/app/outputs/flutter-apk/app-*-release.apk
          if-no-files-found: error

  release:
    needs: build-apk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download universal APK
        uses: actions/download-artifact@v4
        with:
          name: trade-discipline-universal
          path: apks

      - name: Download split APKs
        uses: actions/download-artifact@v4
        with:
          name: trade-discipline-split-per-abi
          path: apks/split

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            apks/app-release.apk
            apks/split/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
